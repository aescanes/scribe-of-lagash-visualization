name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  # Build provenance attestation for the release assets (see the Attest step).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ github.ref_name }}" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match tag (${{ github.ref_name }})"
            exit 1
          fi

      # Signs the exact files this workflow built, with the workflow's own OIDC
      # identity, so `gh attestation verify <file> --repo <this repo>` passes.
      # GitHub's automatic release attestation (from Immutable Releases) uses a
      # different signer identity and does not satisfy that check on its own.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Build release notes from CHANGELOG.md
        run: node release-notes.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes \
            main.js manifest.json styles.css
